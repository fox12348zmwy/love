<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务器繁忙</title>
<style>
body{background:#111;color:#ddd;font-family:monospace;margin:0;padding:16px;font-size:16px}
#log{white-space:pre-wrap;line-height:1.7;min-height:55vh;word-break:break-all}
#q{width:100%;box-sizing:border-box;background:#1c1c1c;color:#ddd;border:1px solid #444;padding:10px;font-size:16px;font-family:monospace;margin-top:12px;border-radius:6px}
button{margin-top:10px;padding:10px 20px;font-size:16px;background:#4a7ebb;color:#fff;border:0;border-radius:6px}
</style>
</head>
<body>
<div id="log"></div>
<input id="q" placeholder="在这里提问">
<button onclick="ask()">发送</button>
<p style="color:#666;font-size:12px">纯前端整活页，不联网，不调用任何模型。</p>
<script>
var log = document.getElementById('log');
var qbox = document.getElementById('q');
var done = '问deepseek提问吧\n';
var cur = '';
function render(){
  log.textContent = done + cur;
  window.scrollTo(0, document.body.scrollHeight);
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function type(s){
  for (var i = 0; i < s.length; i++){
    cur += s[i];
    render();
    await sleep(30 + Math.random() * 90);
  }
  done += cur + '\n';
  cur = '';
  render();
}
async function think(){
  var f = ['|', '/', '-', '+'];
  var t = Date.now() + 3000 + Math.random() * 3000;
  var i = 0;
  while (Date.now() < t){
    cur = '思考中 ' + f[i % 4];
    render();
    i++;
    await sleep(150);
  }
  cur = '';
  render();
}
async function ask(){
  var s = qbox.value.trim() || '（没写问题）';
  qbox.value = '';
  done += '> ' + s + '\n';
  render();
  await think();
  await type('好的，我来想想。');
  await think();
  await type('关键在于先确定前提，如果按通常的理解，');
  await sleep(1000 + Math.random() * 1000);
  done += '\n服务器繁忙，请稍后重试：\n\n问deepseek提问吧\n';
  render();
}
</script>
</body>
</html>
